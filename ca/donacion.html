<!DOCTYPE html>
<html lang="ca">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Donació - SolarTech</title>
<link rel="icon" type="image/png" href="../img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet"
    href="../css/estils.css">

</head>

<body>

    <!-- MENU -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand"
            href="index.html">

                SolarTech

            </a>

        </div>

    </nav>

    <!-- FORMULARI -->

    <section class="container mt-5 mb-5">

        <div class="formulari-donacio">

            <h1 class="mb-4">

                Formulari de donació

            </h1>

            <form>

                <!-- EMAIL -->

                <div class="mb-4">

                    <label class="form-label">

                        Email

                    </label>

                    <input type="email"
                    class="form-control">

                </div>

                <!-- DIRECCIO -->

                <div class="mb-4">

                    <label class="form-label">

                        Direcció

                    </label>

                    <input type="text"
                    class="form-control">

                </div>

                <!-- PAGAMENT -->

                <div class="mb-4">

                    <label class="form-label">

                        Mètode de pagament

                    </label>

                    <select class="form-select">

                        <option>

                            Targeta de crèdit

                        </option>

                        <option>

                            PayPal

                        </option>

                        <option>

                            Transferència bancària

                        </option>

                    </select>

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        Quantitat

                    </label>

                    <select class="form-select">

                        <option>

                            5 euros

                        </option>

                        <option>

                            10 euros

                        </option>

                        <option>

                            15 euros

                        </option>

                    </select>

                </div>

                <!-- BOTO -->

                <button class="btn btn-warning">

                    Finalitzar compra

                </button>

            </form>

        </div>

    </section>
<br>
<br>
<br>
<br>
<br>
<br>
    <!-- PIE -->

    <footer class="pie">

        <p>

            SolarTech

        </p>

    </footer>

</body>

</html>
