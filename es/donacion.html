<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Donación - SolarTech</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet"
    href="../css/estils.css">

</head>

<body>

    <!-- MENU -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand"
            href="index.html">

                SolarTech

            </a>

        </div>

    </nav>

    <!-- FORMULARIO -->

    <section class="container mt-5 mb-5">

        <div class="formulari-donacio">

            <h1 class="mb-4">

                Formulario de donación

            </h1>

            <form>

                <!-- EMAIL -->

                <div class="mb-4">

                    <label class="form-label">

                        Email

                    </label>

                    <input type="email"
                    class="form-control">

                </div>

                <!-- DIRECCIÓN -->

                <div class="mb-4">

                    <label class="form-label">

                        Dirección

                    </label>

                    <input type="text"
                    class="form-control">

                </div>

                <!-- PAGO -->

                <div class="mb-4">

                    <label class="form-label">

                        Método de pago

                    </label>

                    <select class="form-select">

                        <option>

                            Tarjeta de crédito

                        </option>

                        <option>

                            PayPal

                        </option>

                        <option>

                            Transferencia bancaria

                        </option>

                    </select>

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        Cantidad

                    </label>

                    <select class="form-select">

                        <option>

                            5 euros

                        </option>

                        <option>

                            10 euros

                        </option>

                        <option>

                            15 euros

                        </option>

                    </select>

                </div>

                <!-- BOTÓN -->

                <button class="btn btn-warning">

                    Finalizar compra

                </button>

            </form>

        </div>

    </section>

<br><br><br><br><br><br>

    <!-- PIE -->

    <footer class="pie">

        <p>

            SolarTech

        </p>

    </footer>

</body>

</html>
